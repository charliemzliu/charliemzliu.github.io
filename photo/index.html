<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos | Charlie Liu</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      line-height: 1.6;
      color: #222;
      background: #fff;
    }

    nav {
      margin-bottom: 40px;
    }

    nav a {
      margin-right: 18px;
      color: #222;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h1 {
      margin-bottom: 8px;
    }

    .intro {
      margin-top: 0;
      margin-bottom: 30px;
      color: #555;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .gallery a {
      display: block;
      overflow: hidden;
      border-radius: 12px;
      background: #f2f2f2;
      aspect-ratio: 4 / 3;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.25s ease;
    }

    .gallery a:hover img {
      transform: scale(1.03);
    }

    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="/">Home</a>
    <a href="/projects/">Projects</a>
    <a href="/photo/">Photos</a>
  </nav>

  <h1>Photos</h1>
  <p class="intro">A collection of photographs from travel, hiking, and everyday life.</p>

  <div class="gallery">
    <a href="685.jpeg" target="_blank">
      <img src="685.jpeg" alt="Photo 1" loading="lazy">
    </a>

    <a href="IMG_2905.jpeg" target="_blank">
      <img src="IMG_2905.jpeg" alt="Photo 2" loading="lazy">
    </a>

    <a href="IMG_2935.jpeg" target="_blank">
      <img src="IMG_2935.jpeg" alt="Photo 3" loading="lazy">
    </a>

    <a href="IMG_2947.jpeg" target="_blank">
      <img src="IMG_2947.jpeg" alt="Photo 4" loading="lazy">
    </a>

    <a href="IMG_2956.jpeg" target="_blank">
      <img src="IMG_2956.jpeg" alt="Photo 5" loading="lazy">
    </a>

    <a href="IMG_2966.jpeg" target="_blank">
      <img src="IMG_2966.jpeg" alt="Photo 6" loading="lazy">
    </a>
  </div>
</body>
</html>
